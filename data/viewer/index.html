<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>过去问题目面板</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
:root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1f; --muted:#6b6b6b; --line:#e2e2de; --accent:#b4235a; --hl:rgba(214,40,90,.08); }
@media (prefers-color-scheme: dark) { :root { --bg:#151515; --card:#1f1f1f; --fg:#ececec; --muted:#9a9a9a; --line:#333; --accent:#ff6b9a; --hl:rgba(255,107,154,.12); } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.75 -apple-system, "Hiragino Sans", "PingFang SC", sans-serif; }
main { max-width:900px; margin:auto; padding:16px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 18px; margin:12px 0; overflow-x:auto; }
.src { font-size:14px; color:var(--muted); }
h1 { font-size:20px; margin:4px 0 0; }
.tag { display:inline-block; border:1px solid var(--line); border-radius:10px; padding:0 8px; font-size:12px; margin:2px 4px 2px 0; }
.focus { background:var(--hl); border-color:var(--accent); }
.note { color:var(--accent); font-size:14px; }
table { border-collapse:collapse; font-size:14px; width:100%; } td, th { border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top; }
img { max-width:100%; border:1px solid var(--line); background:#fff; border-radius:4px; }
details summary { cursor:pointer; color:var(--muted); }
.empty { color:var(--muted); text-align:center; padding:60px 0; }
.katex-display { overflow-x:auto; overflow-y:hidden; }
</style>
</head>
<body>
<main id="app"><div class="empty">还没有题目。在 Claude 里说“我想练习……”，题目会出现在这里。</div></main>
<script>
let lastStamp = null;

function renderMd(md) {
  const math = [];
  const prot = (md || "").replace(/\$\$([\s\S]+?)\$\$/g, (m, t) => { math.push([t, true]); return "@@M" + (math.length - 1) + "@@"; })
    .replace(/\$([^$\n]+?)\$/g, (m, t) => { math.push([t, false]); return "@@M" + (math.length - 1) + "@@"; });
  return marked.parse(prot).replace(/@@M(\d+)@@/g, (m, i) => {
    const [tex, disp] = math[+i];
    try { return katex.renderToString(tex, { displayMode: disp, throwOnError: false }); }
    catch (e) { return tex; }
  });
}

function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

function renderItem(q, head) {
  const s = q.source;
  const focus = new Set(q.focus || []);
  const subs = (q.subquestions || []).map(x =>
    '<tr class="' + (focus.has(x.label) ? "focus" : "") + '"><td>' + esc(x.label) + '</td><td>' + esc(x.summary_zh) +
    '</td><td>' + esc(x.difficulty) + '</td><td>' + (x.concepts || []).map(c => '<span class="tag">' + esc(c.name) + '</span>').join("") + '</td></tr>').join("");
  const sol = q.solution;
  return '<div class="card"><div class="src">' + head + esc(s.university) + ' ' + esc(s.graduate_school) + ' ' + esc(s.program) +
    '｜' + esc(s.admission_year) + ' 年度入学｜' + esc(s.paper_title) + '</div>' +
    '<h1>' + esc(s.problem_label) + '</h1>' +
    '<div class="src">整题难度 ' + esc(q.difficulty) + '/5 · 预计 ' + esc(q.est_minutes) + ' 分钟 · ' + esc(q.problem_id) + '</div></div>' +
    (focus.size ? '<div class="card"><b>本次重点：</b>' + [...focus].map(l => '<span class="tag focus">' + esc(l) + '</span>').join("") + '</div>' : "") +
    '<div class="card"><details><summary>本题主题、各小问的考点与难度（做完再看）</summary><p>' + esc(q.title_zh) + '</p><table><tr><th>小问</th><th>要求</th><th>难度</th><th>知识点</th></tr>' + subs + '</table></details></div>' +
    (q.errata_md ? '<div class="card"><b class="note">勘误（官方订正，作答时以此为准）</b>' + renderMd(q.errata_md) + '</div>' : "") +
    '<div class="card">' + renderMd(q.content_md) +
    (q.figures || []).map(f => '<figure style="margin:12px 0"><img src="../' + esc(f.url) + '" alt="' + esc(f.description) + '"><figcaption class="src">' + esc(f.description) + '</figcaption></figure>').join("") + '</div>' +
    (sol ? '<div class="card"><b class="note">' + esc(sol.label) + '</b>' +
      '<div class="src">' + [sol.source && "来源：" + sol.source, sol.covers && sol.covers !== "全部" && "覆盖小问：" + sol.covers,
        sol.verified && "核对：" + sol.verified].filter(Boolean).map(esc).join(" · ") + '</div>' + renderMd(sol.text) + '</div>' : "") +
    '<div class="card"><details><summary>原卷页面（转写有疑问时对照）</summary>' +
    (q.page_images || []).map(p => '<img style="margin:8px 0" src="../' + esc(p) + '">').join("") + '</details></div>';
}

function render(q) {
  const items = q.items || [q];
  document.getElementById("app").innerHTML = (q.note ? '<div class="note">' + esc(q.note) + '</div>' : "") +
    items.map((x, i) => renderItem(x, items.length > 1 ? "第 " + (i + 1) + " 题 · " : "")).join('<hr style="border:none;margin:28px 0">') +
    '<div class="src" style="text-align:center">答案和“会/不会”请直接在 Claude 对话里回复。</div>';
}

async function poll() {
  try {
    const r = await fetch("current.json?t=" + Date.now(), { cache: "no-store" });
    if (r.ok) {
      const q = await r.json();
      if (q.updated_at !== lastStamp) { lastStamp = q.updated_at; render(q); window.scrollTo(0, 0); }
    }
  } catch (e) { }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
