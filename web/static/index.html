<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kakomon · 过去问学习助手</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="/static/app.css">
<script>window.KAKOMON_TOKEN = "__TOKEN__";</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><b>kakomon</b><span>过去问学习助手</span></a>
  <a id="goal" class="goal none" href="#/overview">还没有设定备考目标</a>
  <nav aria-label="主导航">
    <a href="#/" data-page="main">刷题</a>
    <a href="#/overview" data-page="overview">学习概况</a>
  </nav>
  <span class="stat" id="today"></span>
  <span class="stat" id="dueTop"></span>
</header>

<main id="page-main" class="page">
  <section class="card chat" aria-label="对话">
    <div class="chead">
      <h2>对话</h2>
      <div class="cctl">
        <label for="model" class="sr">模型</label>
        <select id="model" title="模型">
          <option value="sonnet">Sonnet</option>
          <option value="opus">Opus</option>
        </select>
        <button id="newChat" class="ghost" type="button">新对话</button>
      </div>
    </div>
    <div id="thread" class="thread" aria-live="polite"></div>
    <div class="cfoot">
      <div class="chips" role="group" aria-label="快速回复">
        <button type="button" data-say="会">会</button>
        <button type="button" data-say="部分会">部分会</button>
        <button type="button" data-say="不会">不会</button>
        <button type="button" data-say="给我一个提示">要提示</button>
        <button type="button" data-say="讲解一下这道题">看讲解</button>
      </div>
      <form id="composer" class="composer">
        <label for="input" class="sr">回复</label>
        <textarea id="input" rows="2" placeholder="输入答案或问题（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send" class="send" type="submit" aria-label="发送">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
        <button id="stop" class="stopbtn" type="button" hidden>停止</button>
      </form>
    </div>
  </section>

  <section id="work" class="card work" aria-label="题目区"></section>

  <aside class="rail" aria-label="我的学习">
    <section class="card">
      <h2>掌握度<span id="mscope"></span></h2>
      <div id="mastery"></div>
    </section>
    <section class="card">
      <h2>我的倾向</h2>
      <div id="tend"></div>
      <a href="#/overview" class="more">完整画像</a>
    </section>
    <section class="card">
      <h2>到期复习<span id="dueN"></span></h2>
      <div id="due"></div>
    </section>
  </aside>
</main>

<main id="page-overview" class="page overview" hidden></main>

<script src="/static/app.js"></script>
</body>
</html>
